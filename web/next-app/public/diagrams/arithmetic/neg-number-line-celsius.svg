<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220">
  <title>Number line with interesting Celsius temperatures</title>
  <desc>A number line from minus twenty to forty degrees Celsius. Zero marks the freezing point of water, values to the left are colder, values to the right are warmer.</desc>

  <!-- Axis. Mid-tone strokes read on both the light and the dark surface,
       because the learner's browser decides the background. -->
  <line x1="60" y1="140" x2="660" y2="140" stroke="#9aa0a6" stroke-width="2"/>
  <g stroke="#9aa0a6" stroke-width="2">
    <line x1="60" y1="133" x2="60" y2="140"/>
    <line x1="160" y1="133" x2="160" y2="140"/>
    <line x1="360" y1="133" x2="360" y2="140"/>
    <line x1="460" y1="133" x2="460" y2="140"/>
    <line x1="560" y1="133" x2="560" y2="140"/>
    <line x1="660" y1="133" x2="660" y2="140"/>
  </g>

  <!-- Zero is the reference point, so it gets the emphasis. -->
  <line x1="260" y1="60" x2="260" y2="140" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="260" cy="140" r="3.5" fill="#2563eb"/>

  <g font-family="ui-monospace, monospace" font-size="13" fill="#6b7280" text-anchor="middle">
    <text x="60" y="168">-20</text>
    <text x="160" y="168">-10</text>
    <text x="260" y="168">0</text>
    <text x="360" y="168">10</text>
    <text x="460" y="168">20</text>
    <text x="560" y="168">30</text>
    <text x="660" y="168">40</text>
  </g>

  <g font-family="ui-monospace, monospace" font-size="12" fill="#6b7280">
    <text x="260" y="46" text-anchor="middle" fill="#2563eb">water freezes at 0 °C</text>
    <text x="150" y="96" text-anchor="middle">colder than freezing</text>
    <text x="470" y="96" text-anchor="middle">warmer than freezing</text>
    <text x="60" y="196" text-anchor="start" font-size="11">left of zero: negative</text>
    <text x="660" y="196" text-anchor="end" font-size="11">right of zero: positive</text>
  </g>
</svg>
